<!doctype html><meta charset="utf-8"><title>图片缓存验证</title>
<style>body{font:14px system-ui;background:#f4f6ee;padding:15px}button{margin:0 8px 12px 0;padding:10px}main{display:flex;gap:16px;align-items:flex-start}iframe{width:390px;height:844px;border:1px solid #ccd4c8}pre{max-width:700px;white-space:pre-wrap;font-size:12px}</style>
<button id="reload">再次打开</button><button id="tree">查看树</button><button id="train">查看训练图解</button><button id="read">读取验证结果</button>
<main><iframe id="preview" src="../next/index.html"></iframe><pre id="result">正在加载…</pre></main>
<script>
const frame=document.querySelector('iframe'),out=document.querySelector('pre');
async function report(){
 const w=frame.contentWindow;
 const names=await w.caches.keys();
 const cache=await w.caches.open('kid-fitness-next-images-1');
 const keys=await cache.keys();
 out.textContent=JSON.stringify({controlledBy:w.navigator.serviceWorker.controller?.scriptURL||null,
 imageCache:names.filter(n=>n.startsWith('kid-fitness-next-images-')),cachedImages:keys.length,
 visibleImages:[...w.document.images].filter(i=>i.getBoundingClientRect().height>0).map(i=>({url:i.src.split('/').slice(-2).join('/'),loaded:i.complete&&i.naturalWidth>0})),
 requests:w.performance.getEntriesByType('resource').filter(r=>/\.(png|webp)/.test(r.name)).map(r=>({image:r.name.split('/').pop(),transfer:r.transferSize,worker:Math.round(r.workerStart),ms:Math.round(r.duration)}))},null,2);
}
frame.onload=()=>{setTimeout(report,1500)};
document.querySelector('#read').onclick=report;
document.querySelector('#reload').onclick=()=>frame.contentWindow.location.reload();
document.querySelector('#tree').onclick=()=>{frame.contentDocument.querySelector('[data-view="treeView"]').click();setTimeout(report,500)};
document.querySelector('#train').onclick=()=>{const d=frame.contentDocument;d.querySelector('[data-view="trainView"]').click();d.querySelector('#startSessionPrimary').click();setTimeout(report,500)};
</script>
